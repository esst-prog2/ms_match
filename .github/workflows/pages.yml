# Publishes only the promo page and the app to GitHub Pages.
# Everything else in the repository (spike/, the logs, reviews/, openspec/,
# docs/) stays on github.com and does not go to github.io.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Collect the promo page and the app
        run: |
          mkdir _site
          cp -r index.html css js assets renaissance promo _site/
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
